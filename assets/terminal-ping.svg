<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 256" width="100%" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgg_ping" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="grad_ping" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="940" height="256" rx="14" fill="url(#bgg_ping)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="940" height="34" rx="14" fill="#161b22"/>
  <rect x="0" y="20" width="940" height="14" fill="#161b22"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="470.0" y="22" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" fill="#8b949e">bhuvan-ai — ping github</text>
  <text x="24" y="58" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" fill="#50fa7b">root@bhuvan-ai<tspan fill="#8b949e">:~$ </tspan><tspan fill="#f8f8f2">ping github</tspan></text>

  <text x="24" y="70" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#f8f8f2" opacity="0" data-appear="0.450">PING github.com
    <animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.1111;0.8025;0.8765;1" values="0;1;1;0;0"/>
  </text>
  <text x="24" y="96" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" fill="#8b949e" opacity="0" data-appear="0.800">64 bytes from github.com
    <animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.1975;0.8025;0.8765;1" values="0;1;1;0;0"/>
  </text>
  <text x="24" y="122" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" opacity="0" data-appear="1.150">
    <tspan fill="#f8f8f2">time      </tspan><tspan fill="#8b949e">= </tspan><tspan fill="#50fa7b">14ms</tspan>
    <animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.2840;0.8025;0.8765;1" values="0;1;1;0;0"/>
  </text>
  <text x="24" y="148" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" opacity="0" data-appear="1.500">
    <tspan fill="#f8f8f2">Status    </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#50fa7b">CONNECTED</tspan>
    <animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.3704;0.8025;0.8765;1" values="0;1;1;0;0"/>
  </text>
  <text x="24" y="174" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" opacity="0" data-appear="1.850">
    <tspan fill="#f8f8f2">Packets Received    </tspan><tspan fill="#8b949e">:: </tspan><tspan fill="#50fa7b">100%</tspan>
    <animate attributeName="opacity" dur="4.05s" repeatCount="indefinite" keyTimes="0;0.4568;0.8025;0.8765;1" values="0;1;1;0;0"/>
  </text>
  <text x="24" y="200" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="14" opacity="0" data-appear="2.200">
